<style>
/* Concept: one Seyès notebook sheet per chapter. A red margin line splits the page:
   facts and lab tools hang in the left margin, formulas and notes sit to the right. */
:root {
  --desk: #e8ebf4;
  --paper: #fdfdfc;
  --rule-fine: #e4eaf8;
  --rule-strong: #c6d1ee;
  --rule-v: #dadff1;
  --margin: #e4808b;
  --ink: #1d2860;
  --ink-soft: #4b5789;
  --red: #bf3346;
  --hi: #fff4b8;
  --tab: #dde2f0;
  --shadow: rgba(29, 40, 96, .16);
  --f-display: 'Caveat', 'Segoe Print', cursive;
  --f-body: 'Newsreader', Georgia, 'Times New Roman', serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --margin-w: 9.5rem;
  --pad: 1.5rem;
  --gap: 1.75rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0d1122; --paper: #151b34; --rule-fine: #1c2444; --rule-strong: #2b3664; --rule-v: #202a50;
    --margin: #8f4159; --ink: #e9edff; --ink-soft: #a9b4e8; --red: #ff93a4; --hi: rgba(255, 205, 92, .17);
    --tab: #1a2142; --shadow: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0d1122; --paper: #151b34; --rule-fine: #1c2444; --rule-strong: #2b3664; --rule-v: #202a50;
  --margin: #8f4159; --ink: #e9edff; --ink-soft: #a9b4e8; --red: #ff93a4; --hi: rgba(255, 205, 92, .17);
  --tab: #1a2142; --shadow: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--desk);
  color: var(--ink);
  font: 400 1.0625rem/1.55 var(--f-body);
  padding-inline: 16px;
  padding-block: 1.25rem 3rem;
}
.wrap { max-width: 62rem; margin-inline: auto; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.brand { margin: 0 0 .85rem; font: 500 .75rem/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.brand b { color: var(--ink); font-weight: 500; }

/* index tabs */
.tabs { display: flex; gap: .25rem; margin: 0; padding: 0 .5rem; overflow-x: auto; scrollbar-width: thin; }
.tab {
  flex: none; position: relative; z-index: 0; margin-bottom: -1px;
  padding: .72rem .95rem .6rem;
  font: 500 .75rem/1 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
  color: var(--ink-soft); background: var(--tab);
  border: 1px solid var(--rule-strong); border-bottom: 0; border-radius: .45rem .45rem 0 0;
  cursor: pointer; transition: color .12s, background .12s;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { z-index: 2; color: var(--ink); background: var(--paper); box-shadow: inset 0 3px 0 var(--red); }
.tab:focus-visible, .copy:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* the paper */
.sheet {
  position: relative; z-index: 1;
  padding: 1.9rem var(--pad) 1.5rem;
  background-color: var(--paper);
  background-image:
    linear-gradient(to right, var(--rule-v) 1px, transparent 1px),
    linear-gradient(to bottom, var(--rule-strong) 1px, transparent 1px),
    linear-gradient(to bottom, var(--rule-fine) 1px, transparent 1px);
  background-size: 32px 100%, 100% 32px, 100% 8px;
  border: 1px solid var(--rule-strong);
  border-radius: 0 .35rem .35rem .35rem;
  box-shadow: 0 .8rem 1.8rem -1rem var(--shadow);
}
.sheet::before {
  content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--margin); opacity: .8; pointer-events: none;
  left: calc(var(--pad) + var(--margin-w) + var(--gap) / 2 - 1px);
}

.s-head, .method {
  display: grid; column-gap: var(--gap);
  grid-template-columns: var(--margin-w) minmax(0, 1fr);
}
.s-head { grid-template-areas: "margin title"; align-items: start; }
.method { grid-template-areas: "margin head" "margin body"; grid-template-rows: auto 1fr; }
.method + .method { margin-top: 2.6rem; }
.margin { grid-area: margin; min-width: 0; }
.s-title { grid-area: title; min-width: 0; }
.m-head { grid-area: head; min-width: 0; }
.m-body { grid-area: body; min-width: 0; }

.kicker, .lbl, .facts dt, .notation .lbl {
  font: 500 .6875rem/1.35 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft);
}
.kicker { margin: .55rem 0 .35rem; }
.lab { margin: 0; padding: 0; list-style: none; display: grid; gap: .3rem; font-size: .95rem; line-height: 1.3; }
.lab .soon { font-style: italic; color: var(--ink-soft); }

h2 {
  margin: 0; width: fit-content; max-width: 100%;
  font: 700 clamp(2.5rem, 7vw, 3.7rem)/1.02 var(--f-display); text-wrap: balance;
  text-decoration: underline wavy var(--margin) 2px; text-underline-offset: .22em;
}
.fr { margin: .5rem 0 0; font-style: italic; color: var(--ink-soft); }
.goal { margin: .9rem 0 0; font-size: 1.12rem; }
.goal .lbl { margin-right: .5rem; }

.facts { margin: .35rem 0 0; display: grid; gap: .95rem; }
.facts dd { margin: .2rem 0 0; font-size: .95rem; line-height: 1.3; font-style: italic; }

.m-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: .35rem .85rem; }
h3 { margin: 0; font: 600 1.45rem/1.2 var(--f-body); text-wrap: balance; }
.tag { font: 500 .6875rem/1 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); border: 1px dashed var(--ink-soft); padding: .22rem .5rem; }

.f { margin-top: 1rem; }
.f-head { display: flex; justify-content: space-between; align-items: baseline; gap: .75rem; }
.f-head .lbl { min-width: 0; }
.math { overflow-x: auto; overflow-y: hidden; padding-block: .1rem; color: var(--ink); font-size: 1.2rem; line-height: 1.4; }
.m:not([data-done]) { font-family: var(--f-mono); font-size: .8em; color: var(--ink-soft); white-space: pre; }
.f.key { padding: .55rem .9rem .4rem; background: var(--hi); border: 1.5px solid var(--ink); border-radius: 2px; box-shadow: 3px 3px 0 var(--rule-strong); }
.copy {
  flex: none; min-height: 1.6rem; padding: .25rem .5rem; cursor: pointer;
  font: 500 .625rem/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-soft); background: transparent; border: 1px solid var(--rule-strong); border-radius: 2px;
  transition: color .12s, border-color .12s;
}
.copy:hover { color: var(--ink); border-color: var(--ink); }
.copy[data-state="done"] { color: var(--red); border-color: var(--red); }

mjx-container[jax="SVG"] { color: var(--ink); }
mjx-container[jax="SVG"][display="true"] { display: block !important; text-align: left !important; margin: .3rem 0 !important; }

.notes { margin: 1rem 0 0; padding: 0; list-style: none; display: grid; gap: .3rem; }
.notes li { position: relative; padding-left: 1.15rem; }
.notes li::before { content: "–"; position: absolute; left: 0; color: var(--ink-soft); }

.watch { margin: 1rem 0 0; font: 500 1.4rem/1.2 var(--f-display); color: var(--red); }
.watch b { font-weight: 700; margin-right: .35rem; }

.tbl-wrap { margin-top: 1.2rem; overflow-x: auto; background: var(--paper); background: color-mix(in srgb, var(--paper) 90%, transparent); }
table { width: 100%; min-width: 30rem; border-collapse: collapse; font-size: .97rem; }
caption { caption-side: top; text-align: left; padding-bottom: .4rem; font: 500 .6875rem/1.3 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); }
th, td { padding: .42rem .75rem .42rem 0; text-align: left; vertical-align: top; border-bottom: 1px dashed var(--rule-strong); }
thead th { border-bottom: 1.5px solid var(--ink); font: 500 .6875rem/1.3 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); }
tbody th { font-weight: 600; }

.common { margin-top: 3.2rem !important; padding-top: 1.6rem; border-top: 2px dashed var(--rule-strong); }

.notation { margin-top: 2.4rem; padding-top: .9rem; border-top: 1px solid var(--rule-strong); display: flex; flex-wrap: wrap; gap: .3rem 1.5rem; font-size: .93rem; color: var(--ink-soft); }
.notation .lbl { width: 100%; }
.hint { margin: .9rem 0 0; font: 400 .75rem/1.4 var(--f-mono); color: var(--ink-soft); }

@media (max-width: 42rem) {
  :root { --pad: 1rem; --gap: 0rem; }
  .sheet { padding-left: 1.9rem; }
  .sheet::before { left: 1.25rem; }
  .s-head { grid-template-columns: minmax(0, 1fr); grid-template-areas: "title" "margin"; row-gap: 1rem; }
  .method { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "margin" "body"; grid-template-rows: auto; row-gap: .6rem; }
  .facts { margin: 0; display: flex; flex-wrap: wrap; gap: .5rem 1.4rem; }
  .kicker { margin-top: 0; }
  .lab { display: flex; flex-wrap: wrap; gap: .2rem 1rem; }
  .f.key { padding-inline: .7rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  body { background: #fff; padding: 0; }
  .tabs, .hint, .copy, .brand { display: none !important; }
  .panel[hidden] { display: block !important; }
  .panel { break-after: page; }
  .sheet { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>

<script>
const DATA = {"sheets":[{"id":"nonlinear","tab":"Nonlinear","title":"Nonlinear Equations","fr":"Équations non linéaires","goal":"Find $x^*$ such that $f(x^*)=0$.","lab":["Newton-Raphson","Bisection Method","Fixed Point Iteration","Secant Method"],"methods":[{"name":"Bisection","tag":"Bracketing","facts":[["Order","1 (linear)"],["Needs","$f(a)f(b)<0$"],["Cost","1 eval per step"]],"formulas":[{"label":"Midpoint","tex":"c_n=\\dfrac{a_n+b_n}{2}","key":true},{"label":"Keep the half with the sign change","tex":"[a_{n+1},b_{n+1}]=\\begin{cases}{[a_n,c_n]} & f(a_n)f(c_n)<0\\\\ {[c_n,b_n]} & \\text{otherwise}\\end{cases}"},{"label":"Error bound","tex":"|c_n-x^*|\\le\\dfrac{b_0-a_0}{2^{\\,n+1}}"},{"label":"Steps needed for tolerance $\\varepsilon$","tex":"n\\ge\\log_2\\dfrac{b_0-a_0}{\\varepsilon}-1"}],"watch":"Check $f(a)f(b)<0$ before you start. It finds one root in the bracket, never all of them."},{"name":"Newton-Raphson","tag":"Tangent","facts":[["Order","2 (quadratic)"],["Needs","$f'(x_n)\\neq0$"],["Cost","$f$ and $f'$ per step"]],"formulas":[{"label":"Update","tex":"x_{n+1}=x_n-\\dfrac{f(x_n)}{f'(x_n)}","key":true},{"label":"Origin: tangent at $x_n$, then set $y=0$","tex":"y=f(x_n)+f'(x_n)\\,(x-x_n)"},{"label":"Error, with $e_n=x_n-x^*$","tex":"e_{n+1}\\approx\\dfrac{f''(x^*)}{2f'(x^*)}\\,e_n^{2}"},{"label":"Root of multiplicity $m$ (restores order 2)","tex":"x_{n+1}=x_n-m\\,\\dfrac{f(x_n)}{f'(x_n)}"}],"watch":"A poor $x_0$ or $f'(x_n)\\approx0$ throws the iterate far away. On a multiple root, plain Newton is only linear."},{"name":"Fixed point","tag":"Iteration x = g(x)","facts":[["Order","1, rate $|g'(x^*)|$"],["Needs","$|g'|\\le k<1$"],["Cost","1 eval per step"]],"formulas":[{"label":"Rewrite the equation","tex":"f(x)=0\\iff x=g(x)"},{"label":"Iteration","tex":"x_{n+1}=g(x_n)","key":true},{"label":"Convergence condition on $[a,b]$","tex":"g([a,b])\\subseteq[a,b]\\quad\\text{and}\\quad |g'(x)|\\le k<1"},{"label":"A priori error","tex":"|x_n-x^*|\\le\\dfrac{k^{n}}{1-k}\\,|x_1-x_0|"},{"label":"A posteriori error","tex":"|x_n-x^*|\\le\\dfrac{k}{1-k}\\,|x_n-x_{n-1}|"}],"watch":"One equation has many choices of $g$, and some diverge. Test $|g'(x^*)|<1$ first. If $g'(x^*)=0$, convergence is at least quadratic."},{"name":"Secant","tag":"Derivative-free","facts":[["Order","$\\approx1.618$"],["Needs","2 start values"],["Cost","1 eval per step"]],"formulas":[{"label":"Update","tex":"x_{n+1}=x_n-f(x_n)\\,\\dfrac{x_n-x_{n-1}}{f(x_n)-f(x_{n-1})}","key":true},{"label":"Newton with the slope replaced","tex":"f'(x_n)\\approx\\dfrac{f(x_n)-f(x_{n-1})}{x_n-x_{n-1}}"},{"label":"Error","tex":"|e_{n+1}|\\approx C\\,|e_n|^{(1+\\sqrt5)/2}"}],"watch":"If $f(x_n)=f(x_{n-1})$ the denominator is zero. It does not keep a bracket, so it can leave the interval."}],"common":{"title":"Stopping and comparing","tag":"Cheat box","facts":[["Applies to","all four methods"]],"formulas":[{"label":"Step size","tex":"|x_{n+1}-x_n|<\\varepsilon"},{"label":"Relative step","tex":"\\dfrac{|x_{n+1}-x_n|}{|x_{n+1}|}<\\varepsilon"},{"label":"Residual","tex":"|f(x_{n+1})|<\\varepsilon"},{"label":"Order of convergence $p$","tex":"\\lim_{n\\to\\infty}\\dfrac{|e_{n+1}|}{|e_n|^{p}}=C"}],"table":{"title":"Which method?","head":["Method","Order $p$","Derivative","Guaranteed"],"rows":[["Bisection","1","no","yes, with a bracket"],["Newton","2","$f'$","no"],["Fixed point","1","no","if $|g'|<1$"],["Secant","1.618","no","no"]]},"watch":"Always add a cap $n\\ge N_{\\max}$. A step-size test alone can stop early on a flat function, so check the residual too."},"notation":["$x^*$ exact root","$x_n$ approximation after $n$ steps","$e_n=x_n-x^*$ error","$\\varepsilon$ tolerance","$N_{\\max}$ iteration cap"]},{"id":"linear","tab":"Linear systems","title":"Linear Systems","fr":"Systèmes linéaires","goal":"Solve $A\\mathbf{x}=\\mathbf{b}$ with $A\\in\\mathbb{R}^{n\\times n}$.","lab":["2×2 Graphical Solver","Jacobi Iteration","Gauss-Seidel","Matrix Algebra Lab"],"methods":[{"name":"2×2 system (Cramer)","tag":"Direct, small","facts":[["Needs","$\\Delta\\neq0$"],["Cost","a few operations"],["Picture","two lines"]],"formulas":[{"label":"System","tex":"\\begin{cases}a_1x+b_1y=c_1\\\\ a_2x+b_2y=c_2\\end{cases}"},{"label":"Determinant","tex":"\\Delta=a_1b_2-a_2b_1"},{"label":"Solution","tex":"x=\\dfrac{c_1b_2-c_2b_1}{\\Delta},\\qquad y=\\dfrac{a_1c_2-a_2c_1}{\\Delta}","key":true}],"notes":["$\\Delta\\neq0$: the two lines cross at one point.","$\\Delta=0$: parallel lines (no solution) or the same line (infinitely many)."]},{"name":"Gaussian elimination","tag":"Direct","facts":[["Cost","$\\tfrac23n^3$ flops"],["Needs","pivot $\\neq0$"],["Gives","exact answer, up to rounding"]],"formulas":[{"label":"Multiplier at step $k$","tex":"m_{ik}=\\dfrac{a_{ik}^{(k)}}{a_{kk}^{(k)}},\\qquad i>k","key":true},{"label":"Row update","tex":"a_{ij}^{(k+1)}=a_{ij}^{(k)}-m_{ik}\\,a_{kj}^{(k)},\\qquad b_i^{(k+1)}=b_i^{(k)}-m_{ik}\\,b_k^{(k)}"},{"label":"Back substitution","tex":"x_n=\\dfrac{b_n}{a_{nn}},\\qquad x_i=\\dfrac{1}{a_{ii}}\\Big(b_i-\\sum_{j=i+1}^{n}a_{ij}x_j\\Big)"},{"label":"Partial pivoting at step $k$","tex":"|a_{pk}^{(k)}|=\\max_{i\\ge k}|a_{ik}^{(k)}|\\ \\Rightarrow\\ \\text{swap rows }p\\text{ and }k"},{"label":"Determinant ($s$ = number of row swaps)","tex":"\\det A=(-1)^s\\prod_{k=1}^{n}a_{kk}^{(k)}"}],"watch":"Without pivoting, a tiny pivot amplifies rounding errors. Always take the largest $|a_{ik}|$ in the column."},{"name":"LU factorization","tag":"Direct","facts":[["Cost","$\\tfrac23n^3$ once, then $O(n^2)$ per $\\mathbf b$"],["Needs","pivoting if a pivot is 0"],["Use","many right-hand sides"]],"formulas":[{"label":"Factorization ($P$ records row swaps)","tex":"PA=LU","key":true},{"label":"$L$ stores the multipliers (3×3 shown)","tex":"L=\\begin{pmatrix}1&0&0\\\\ m_{21}&1&0\\\\ m_{31}&m_{32}&1\\end{pmatrix}"},{"label":"Forward: $Ly=Pb$","tex":"y_i=(Pb)_i-\\sum_{j<i}l_{ij}\\,y_j"},{"label":"Backward: $Ux=y$","tex":"x_i=\\dfrac{1}{u_{ii}}\\Big(y_i-\\sum_{j>i}u_{ij}\\,x_j\\Big)"},{"label":"Doolittle, no pivoting","tex":"u_{ij}=a_{ij}-\\sum_{k=1}^{i-1}l_{ik}u_{kj}\\ (j\\ge i),\\qquad l_{ij}=\\dfrac{1}{u_{jj}}\\Big(a_{ij}-\\sum_{k=1}^{j-1}l_{ik}u_{kj}\\Big)\\ (i>j)"},{"label":"Determinant","tex":"\\det A=(-1)^s\\prod_{i}u_{ii}"}],"notes":["$U$ is the triangular matrix you end with after elimination."]},{"name":"Jacobi","tag":"Iterative","facts":[["Order","1 (linear)"],["Needs","diagonal dominance (sufficient)"],["Cost","$O(n^2)$ per sweep"]],"formulas":[{"label":"Component form","tex":"x_i^{(k+1)}=\\dfrac{1}{a_{ii}}\\Big(b_i-\\sum_{j\\neq i}a_{ij}\\,x_j^{(k)}\\Big)","key":true},{"label":"Matrix form","tex":"x^{(k+1)}=T_J\\,x^{(k)}+D^{-1}b,\\qquad T_J=-D^{-1}(L+U)"}],"notes":["Split $A=L+D+U$: strictly lower, diagonal, strictly upper. These $L$ and $U$ are not the LU factors.","Every component uses only the previous sweep, so the $n$ updates are independent."]},{"name":"Gauss-Seidel","tag":"Iterative","facts":[["Order","1 (linear)"],["Needs","diagonal dominance or SPD"],["Speed","usually faster than Jacobi"]],"formulas":[{"label":"Component form","tex":"x_i^{(k+1)}=\\dfrac{1}{a_{ii}}\\Big(b_i-\\sum_{j<i}a_{ij}\\,x_j^{(k+1)}-\\sum_{j>i}a_{ij}\\,x_j^{(k)}\\Big)","key":true},{"label":"Matrix form","tex":"(D+L)\\,x^{(k+1)}=b-U\\,x^{(k)},\\qquad T_{GS}=-(D+L)^{-1}U"}],"notes":["Uses each new value immediately, so it is sequential and needs one vector of storage."]},{"name":"Conditioning","tag":"Sensitivity","facts":[["Small cond","well-conditioned"],["Large cond","small input change, large output change"]],"formulas":[{"label":"Condition number","tex":"\\operatorname{cond}(A)=\\lVert A\\rVert\\,\\lVert A^{-1}\\rVert\\ \\ge1","key":true},{"label":"Perturbation of $b$","tex":"\\dfrac{\\lVert\\delta x\\rVert}{\\lVert x\\rVert}\\le\\operatorname{cond}(A)\\,\\dfrac{\\lVert\\delta b\\rVert}{\\lVert b\\rVert}"},{"label":"Residual $r=b-A\\tilde x$ versus error","tex":"\\dfrac{\\lVert x-\\tilde x\\rVert}{\\lVert x\\rVert}\\le\\operatorname{cond}(A)\\,\\dfrac{\\lVert r\\rVert}{\\lVert b\\rVert}"},{"label":"Common norms","tex":"\\lVert x\\rVert_\\infty=\\max_i|x_i|,\\qquad \\lVert A\\rVert_\\infty=\\max_i\\sum_j|a_{ij}|,\\qquad \\lVert A\\rVert_1=\\max_j\\sum_i|a_{ij}|"}],"watch":"A tiny residual does not prove a small error when $\\operatorname{cond}(A)$ is large. You lose about $\\log_{10}\\operatorname{cond}(A)$ digits."}],"common":{"title":"Iterative methods: convergence","tag":"Cheat box","facts":[["Applies to","Jacobi and Gauss-Seidel"]],"formulas":[{"label":"Converges for every start iff","tex":"\\rho(T)<1"},{"label":"Sufficient: strict diagonal dominance","tex":"|a_{ii}|>\\sum_{j\\neq i}|a_{ij}|\\quad\\text{for every }i"},{"label":"Error bound when $\\lVert T\\rVert<1$","tex":"\\lVert x^{(k)}-x^*\\rVert\\le\\dfrac{\\lVert T\\rVert^{k}}{1-\\lVert T\\rVert}\\,\\lVert x^{(1)}-x^{(0)}\\rVert"},{"label":"Stopping test","tex":"\\lVert x^{(k+1)}-x^{(k)}\\rVert_\\infty<\\varepsilon\\quad\\text{or}\\quad\\lVert b-Ax^{(k)}\\rVert<\\varepsilon"}],"table":{"title":"Direct or iterative?","head":["","Direct (Gauss, LU)","Iterative (Jacobi, G-S)"],"rows":[["Best for","small or dense $A$","large, sparse, diagonally dominant $A$"],["Cost","$O(n^3)$","$O(n^2)$ per sweep, times sweeps"],["Result","exact up to rounding","approximation, stopped at $\\varepsilon$"],["Fails when","zero pivot, no pivoting","$\\rho(T)\\ge1$"]]}},"notation":["$P$ permutation (row swaps)","$\\rho(T)$ spectral radius, the largest $|\\lambda|$","$\\lVert\\cdot\\rVert_\\infty$ max-row-sum norm","$x^{(k)}$ iterate after $k$ sweeps","SPD symmetric positive definite"]},{"id":"integration","tab":"Integration","title":"Numerical Integration","fr":"Intégration numérique","goal":"Approximate $I=\\int_a^b f(x)\\,dx$ with $h=\\dfrac{b-a}{n}$ and $x_i=a+ih$.","lab":["Trapezoidal Rule","Simpson's 1/3 Rule","Simpson's 3/8 Rule"],"methods":[{"name":"Trapezoidal rule","tag":"Degree 1","facts":[["Order","$O(h^2)$"],["Exact for","degree $\\le1$"],["Needs","any $n$"]],"formulas":[{"label":"One interval","tex":"T=\\dfrac{b-a}{2}\\big[f(a)+f(b)\\big]"},{"label":"Composite","tex":"T_n=\\dfrac{h}{2}\\Big[f(x_0)+2\\sum_{i=1}^{n-1}f(x_i)+f(x_n)\\Big]","key":true},{"label":"Error, $\\xi\\in(a,b)$","tex":"I-T_n=-\\dfrac{(b-a)\\,h^2}{12}\\,f''(\\xi)"},{"label":"Steps for tolerance $\\varepsilon$, $M_2=\\max|f''|$","tex":"n\\ge\\sqrt{\\dfrac{(b-a)^3M_2}{12\\,\\varepsilon}}"}]},{"name":"Simpson 1/3","tag":"Degree 2","facts":[["Order","$O(h^4)$"],["Exact for","degree $\\le3$"],["Needs","$n$ even"]],"formulas":[{"label":"One panel","tex":"S=\\dfrac{b-a}{6}\\Big[f(a)+4f\\big(\\tfrac{a+b}{2}\\big)+f(b)\\Big]"},{"label":"Composite","tex":"S_n=\\dfrac{h}{3}\\Big[f(x_0)+4\\sum_{i=1}^{n/2}f(x_{2i-1})+2\\sum_{i=1}^{n/2-1}f(x_{2i})+f(x_n)\\Big]","key":true},{"label":"Error","tex":"I-S_n=-\\dfrac{(b-a)\\,h^4}{180}\\,f^{(4)}(\\xi)"},{"label":"Steps for tolerance $\\varepsilon$, $M_4=\\max|f^{(4)}|$","tex":"n\\ge\\Big(\\dfrac{(b-a)^5M_4}{180\\,\\varepsilon}\\Big)^{1/4}"}],"notes":["Weights along the nodes: 1, 4, 2, 4, 2, …, 4, 1."]},{"name":"Simpson 3/8","tag":"Degree 3","facts":[["Order","$O(h^4)$"],["Exact for","degree $\\le3$"],["Needs","$n$ multiple of 3"]],"formulas":[{"label":"One panel","tex":"S^{3/8}=\\dfrac{3h}{8}\\big[f_0+3f_1+3f_2+f_3\\big]"},{"label":"Composite","tex":"S_n^{3/8}=\\dfrac{3h}{8}\\big[f_0+3f_1+3f_2+2f_3+3f_4+3f_5+2f_6+\\cdots+3f_{n-1}+f_n\\big]","key":true},{"label":"Error","tex":"I-S_n^{3/8}=-\\dfrac{(b-a)\\,h^4}{80}\\,f^{(4)}(\\xi)"}],"notes":["Same order as Simpson 1/3 with a larger error constant (1/80 against 1/180).","When $n$ is odd, use one 3/8 panel and Simpson 1/3 on the rest."]}],"common":{"title":"Error estimate by halving $h$","tag":"Cheat box","facts":[["Applies to","all three rules"]],"formulas":[{"label":"Richardson on the trapezoid (gives Simpson)","tex":"I\\approx T_{2n}+\\dfrac{T_{2n}-T_n}{3}"},{"label":"Richardson on Simpson","tex":"I\\approx S_{2n}+\\dfrac{S_{2n}-S_n}{15}"},{"label":"Error estimate i-1}+2(h_{i-1}+h_i)\\,c_i+h_ic_{i+1}=3\\Big(\\dfrac{a_{i+1}-a_i}{h_i}-\\dfrac{a_i-a_{i-1}}{h_{i-1}}\\Big)","key":true},{"label":"Ends and values","tex":"c_0=c_n=0,\\qquad a_i=y_i"},{"label":"Recover the rest","tex":"b_i=\\dfrac{a_{i+1}-a_i}{h_i}-\\dfrac{h_i}{3}\\,(2c_i+c_{i+1}),\\qquad d_i=\\dfrac{c_{i+1}-c_i}{3h_i}"}]},{"name":"Least squares","tag":"Approximation","facts":[["Goal","minimise $\\sum r_i^2$"],["Needs","more points than unknowns"],["Solve","normal equations"]],"formulas":[{"label":"Normal equations, degree $m$ ($A$ = Vandermonde)","tex":"A^{T}A\\,c=A^{T}y,\\qquad A_{ij}=x_i^{\\,j},\\ j=0,\\dots,m","key":true},{"label":"Straight line $y\\approx a+bx$","tex":"b=\\dfrac{n\\sum x_iy_i-\\sum x_i\\sum y_i}{n\\sum x_i^2-\\big(\\sum x_i\\big)^2},\\qquad a=\\bar y-b\\,\\bar x"},{"label":"Quality of the fit","tex":"R^2=1-\\dfrac{\\sum(y_i-\\hat y_i)^2}{\\sum(y_i-\\bar y)^2}"}],"watch":"A higher degree always lowers the residual, even when it only fits the noise. Compare on points you did not fit."}],"common":{"title":"Choosing the tool","tag":"Cheat box","facts":[["Applies to","this whole sheet"]],"formulas":[{"label":"Chebyshev nodes on $[a,b]$ (tame the Runge effect)","tex":"x_k=\\dfrac{a+b}{2}+\\dfrac{b-a}{2}\\cos\\dfrac{(2k+1)\\pi}{2n+2},\\quad k=0,\\dots,n"}],"table":{"title":"Interpolation or least squares?","head":["","Interpolation","Least squares"],"rows":[["Passes through the data","yes, every point","no, it smooths"],["Best for","exact, clean data","noisy data, trends"],["Main danger","oscillation at high degree","wrong model degree"]]}},"notation":["$(x_i,y_i)$ data points","$p_n$ polynomial of degree $\\le n$","$h_i=x_{i+1}-x_i$ spacing","$\\bar x,\\bar y$ means","$r_i=y_i-p(x_i)$ residual"]}]};

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function rich(s) {
  return esc(s).replace(/\$([^$]+)\$/g, function (_, t) {
    return '<span class="m" data-tex="' + t + '">' + t + '</span>';
  });
}
function formula(f) {
  return '<div class="f' + (f.key ? ' key' : '') + '">' +
    '<div class="f-head"><span class="lbl">' + rich(f.label) + '</span>' +
    '<button class="copy" type="button" data-tex="' + esc(f.tex) + '" aria-label="Copy LaTeX source">TeX</button></div>' +
    '<div class="math"><div class="m" data-display="1" data-tex="' + esc(f.tex) + '">' + esc(f.tex) + '</div></div></div>';
}
function facts(list) {
  return '<dl class="facts">' + list.map(function (p) {
    return '<div><dt>' + esc(p[0]) + '</dt><dd>' + rich(p[1]) + '</dd></div>';
  }).join('') + '</dl>';
}
function notes(list) {
  return list && list.length ? '<ul class="notes">' + list.map(function (n) { return '<li>' + rich(n) + '</li>'; }).join('') + '</ul>' : '';
}
function watch(t) {
  return t ? '<p class="watch"><b>Watch out:</b>' + rich(t) + '</p>' : '';
}
function table(t) {
  if (!t) return '';
  return '<div class="tbl-wrap"><table><caption>' + esc(t.title) + '</caption><thead><tr>' +
    t.head.map(function (h) { return '<th scope="col">' + rich(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    t.rows.map(function (r) {
      return '<tr>' + r.map(function (c, i) { return i === 0 ? '<th scope="row">' + rich(c) + '</th>' : '<td>' + rich(c) + '</td>'; }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
}
function method(m, extra) {
  return '<article class="method' + (extra || '') + '">' +
    '<div class="margin">' + facts(m.facts) + '</div>' +
    '<header class="m-head"><h3>' + rich(m.name || m.title) + '</h3><span class="tag">' + esc(m.tag) + '</span></header>' +
    '<div class="m-body">' + (m.formulas || []).map(formula).join('') + notes(m.notes) + table(m.table) + watch(m.watch) + '</div></article>';
}
function sheet(s) {
  var lab = s.lab.length ? s.lab.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') : '<li class="soon">Planned for the Lab</li>';
  return '<div class="sheet">' +
    '<div class="s-head"><div class="margin"><p class="kicker">Lab tools</p><ul class="lab">' + lab + '</ul></div>' +
    '<div class="s-title"><h2>' + esc(s.title) + '</h2><p class="fr">' + esc(s.fr) + '</p>' +
    '<p class="goal"><span class="lbl">Goal</span>' + rich(s.goal) + '</p></div></div>' +
    '<div style="height:2.2rem"></div>' +
    s.methods.map(function (m) { return method(m); }).join('') +
    method(s.common, ' common') +
    '<div class="notation"><span class="lbl">Notation</span>' + s.notation.map(function (n) { return '<span>' + rich(n) + '</span>'; }).join('') + '</div>' +
    '</div>';
}

var ids = DATA.sheets.map(function (s) { return s.id; });
var tabsEl = document.getElementById('tabs');
var panelsEl = document.getElementById('panels');
tabsEl.innerHTML = DATA.sheets.map(function (s) {
  return '<button class="tab" type="button" role="tab" id="t-' + s.id + '" data-id="' + s.id + '" aria-controls="p-' + s.id + '">' + esc(s.tab) + '</button>';
}).join('');
panelsEl.innerHTML = DATA.sheets.map(function (s) {
  return '<section class="panel" role="tabpanel" id="p-' + s.id + '" data-id="' + s.id + '" aria-labelledby="t-' + s.id + '" hidden>' + sheet(s) + '</section>';
}).join('');
var tabEls = Array.prototype.slice.call(tabsEl.children);
var panelEls = Array.prototype.slice.call(panelsEl.children);
var current = ids[0];

function select(id) {
  if (ids.indexOf(id) < 0) id = ids[0];
  current = id;
  tabEls.forEach(function (t) {
    var on = t.dataset.id === id;
    t.setAttribute('aria-selected', on ? 'true' : 'false');
    t.tabIndex = on ? 0 : -1;
    if (on) { try { t.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) {} }
  });
  panelEls.forEach(function (p) { p.hidden = p.dataset.id !== id; });
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}
tabsEl.addEventListener('click', function (e) {
  var t = e.target.closest('.tab');
  if (t) select(t.dataset.id);
});
tabsEl.addEventListener('keydown', function (e) {
  var i = ids.indexOf(current), n = null;
  if (e.key === 'ArrowRight') n = (i + 1) % ids.length;
  else if (e.key === 'ArrowLeft') n = (i - 1 + ids.length) % ids.length;
  else if (e.key === 'Home') n = 0;
  else if (e.key === 'End') n = ids.length - 1;
  if (n !== null) { e.preventDefault(); select(ids[n]); tabEls[n].focus(); }
});
window.addEventListener('hashchange', function () { select(location.hash.slice(1)); });
select(location.hash.slice(1));

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).catch(function () { return fallbackCopy(text); });
  }
  return fallbackCopy(text);
}
function fallbackCopy(text) {
  return new Promise(function (resolve, reject) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    ok ? resolve() : reject();
  });
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('.copy');
  if (!b) return;
  var done = function (label, state) {
    b.textContent = label; b.dataset.state = state;
    setTimeout(function () { b.textContent = 'TeX'; delete b.dataset.state; }, 1400);
  };
  copyText(b.dataset.tex).then(function () { done('Copied', 'done'); }, function () { done('Failed', 'done'); });
});

function typeset() {
  try { document.head.appendChild(MathJax.svgStylesheet()); } catch (e) {}
  Array.prototype.slice.call(document.querySelectorAll('.m')).forEach(function (el) {
    try {
      var node = MathJax.tex2svg(el.dataset.tex, { display: !!el.dataset.display });
      el.replaceChildren(node);
      el.dataset.done = '1';
    } catch (e) {}
  });
}
if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
  MathJax.startup.promise.then(typeset).catch(function () {});
}
</script>
