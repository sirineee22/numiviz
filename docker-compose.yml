services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: numiviz-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SQLITE_DB_PATH=numiviz.db
      - ALLOWED_ORIGINS=http://localhost:8080,http://localhost:5173,http://localhost:3000,http://127.0.0.1:8080,http://127.0.0.1:5173
      - APP_NAME=NumiViz API
      - APP_VERSION=2.0.0
      - JWT_SECRET=numiviz-production-secret-key-please-change-if-needed
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_DAYS=7
    volumes:
      - ./backend/numiviz.db:/app/numiviz.db
      - backend_media:/app/media
      - backend_instance:/app/instance
    networks:
      - numiviz-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: numiviz-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - numiviz-net

volumes:
  backend_media:
  backend_instance:

networks:
  numiviz-net:
    driver: bridge
